# 5GB 메모리 환경 기준. 여유가 있으면 Xmx를 올려도 된다.
org.gradle.jvmargs=-Xmx1280m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.caching=true
kotlin.compiler.execution.strategy=in-process
kotlin.code.style=official
android.useAndroidX=true
android.nonTransitiveRClass=true

# 제출용 APK 파일명: apk/<teamName>_ChargeNap_release.apk
chargenap.teamName=TeamChargeNap

# 화면 스냅샷 테스트(Roborazzi)가 PNG를 기록하게 한다 → docs/screenshots/
roborazzi.test.record=true
